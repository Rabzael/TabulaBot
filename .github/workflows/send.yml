name: Send scheduled message

on:
  schedule:
    # Every Friday at 06:00 UTC.
    # This is 08:00 in Italy during daylight saving time and 07:00 in winter.
    - cron: "0 6 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: python tabula.py --force --more data/tabula.yaml data/2026.jsonl

      - name: Commit updated calendar
        run: |
          if git diff --quiet -- data/2026.jsonl; then
            echo "Calendar unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/2026.jsonl
          git commit -m "Update sent calendar entry"
          git push
